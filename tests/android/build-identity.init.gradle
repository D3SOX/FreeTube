// Run with: ./android/gradlew -p android -I ../tests/android/build-identity.init.gradle verifyBuildIdentity
// Repeat with -PtestBuildType=nightly to check optimized nightly instrumentation.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def variants = app.android.applicationVariants

    app.tasks.register('verifyBuildIdentity') {
        doLast {
            def production = variants.find { it.name == 'release' }
            assert production.applicationId == 'org.opentubex.app'
            for (entry in [
                [variant: 'debug', suffix: 'dev', label: 'OpenTubeX Dev', resources: 'src/dev/res'],
                [variant: 'nightly', suffix: 'nightly', label: 'OpenTubeX Nightly', resources: 'src/debug/res']
            ]) {
                def variant = variants.find { it.name == entry.variant }
                assert variant.applicationId == "org.opentubex.app.${entry.suffix}"
                assert app.android.sourceSets[entry.variant].res.srcDirs == [app.file(entry.resources)] as Set
                for (name in ['app_name', 'title_activity_main']) {
                    assert variant.buildType.resValues["string/${name}"]?.value == entry.label
                }
                assert variant.signingConfig.storeFile == app.rootProject.file('nightly.keystore')
                if (variant.name == app.android.testBuildType) {
                    assert variant.testVariant.applicationId == "${variant.applicationId}.test"
                }
                println "Verified ${variant.applicationId}: ${entry.label}, isolated from production"
            }
            def nightly = variants.find { it.name == 'nightly' }
            assert nightly.buildType.minifyEnabled
            assert nightly.buildType.shrinkResources
        }
    }
}
