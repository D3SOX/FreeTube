name: Theme previews

on:
  discussion:
    types: [ created, edited, category_changed ]
  workflow_dispatch:
    inputs:
      discussion:
        description: Theme discussion number to capture or refresh
        required: true
        type: number

permissions: {}

concurrency:
  group: theme-preview-${{ github.event.discussion.number || inputs.discussion }}
  # Let publication finish before the next edit checks the existing comment.
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.discussion.category.slug == 'themes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      discussions: write
    env:
      THEME_PREVIEW_DIR: .tmp/theme-preview
      DISCUSSION_NUMBER: ${{ github.event.discussion.number || inputs.discussion }}
    steps:
    - name: Check out trusted capture code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Manual dispatch already executes workflow code from the selected ref.
        # Discussion events always use the trusted default branch.
        ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11
        cache: false

    - run: pnpm run ci

    - name: Check whether previews are needed
      id: request
      env:
        GH_TOKEN: ${{ github.token }}
      run: node _scripts/themePreview.mjs prepare "$THEME_PREVIEW_DIR"

    - name: Install Electron
      if: steps.request.outputs.enabled == 'true'
      run: pnpm exec install-electron

    - name: Pack the capture app
      if: steps.request.outputs.enabled == 'true'
      run: pnpm run test:e2e:pack

    - name: Capture three previews
      if: steps.request.outputs.enabled == 'true'
      env:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
        LANGUAGE: en_US
      run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm exec playwright test -c e2e/theme-previews/playwright.config.mjs

    - name: Upload discussion attachments
      if: steps.request.outputs.enabled == 'true'
      env:
        # Native attachments require a user token with write access to this repo.
        # GitHub does not support attachment uploads with GITHUB_TOKEN.
        GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: node _scripts/themePreview.mjs upload "$THEME_PREVIEW_DIR"

    - name: Fill the Screenshots section in the discussion
      if: steps.request.outputs.enabled == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: node _scripts/themePreview.mjs publish "$THEME_PREVIEW_DIR"

    - name: Keep failed capture diagnostics
      if: failure() && steps.request.outputs.enabled == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: theme-preview-diagnostics
        path: e2e/results/theme-previews/
        retention-days: 7
